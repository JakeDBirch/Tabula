# Builds the iOS app and uploads it to App Store Connect, which is what puts a
# build in front of TestFlight testers.
#
# Deliberately NOT on every push to main. A macOS runner is billed at ten times
# the rate of a Linux one, App Store Connect rejects a build number it has seen
# before, and every upload notifies your testers — none of which you want from a
# one-line CSS fix. Ship a beta by hand (Actions ▸ iOS TestFlight ▸ Run workflow)
# or by pushing a tag.
#
# Setup — five repository secrets. Full walkthrough in docs/ios-testflight.md.
#
# From one App Store Connect API key (Users and Access ▸ Integrations ▸ App
# Store Connect API ▸ Team Keys, role "App Manager"). The .p8 downloads exactly
# once and cannot be re-downloaded:
#
#   APPSTORE_KEY_ID        the key's Key ID, e.g. ABC123DEFG
#   APPSTORE_ISSUER_ID     the Issuer ID shown above the key list (a UUID)
#   APPSTORE_PRIVATE_KEY   the .p8, base64'd:  base64 -i AuthKey_XXX.p8 | pbcopy
#
# And the Apple Distribution certificate, exported from Keychain Access as a
# .p12 (certificate AND private key together):
#
#   APPLE_DIST_CERT_P12    the .p12, base64'd:  base64 -i dist.p12 | pbcopy
#   APPLE_DIST_CERT_PASSWORD  the password set when exporting it
#
# Why the certificate has to be a secret, rather than letting the API key
# conjure one: a signing certificate's PRIVATE KEY never leaves the machine that
# generated it and cannot be downloaded from Apple. So on a fresh runner with an
# empty keychain, automatic signing does not "fetch" the certificate — it mints
# a brand new one. Apple caps you at three Apple Distribution certificates per
# account, so that approach bricks the account's signing after three CI runs.
# Importing the existing certificate is what makes the runs idempotent; the API
# key is then only used for the provisioning profile and the upload.
#
# The Team ID is not a secret and lives in ios/Config/LoudLight.xcconfig with the
# bundle identifier.
#
# Full walkthrough, including the App Store Connect side: docs/ios-testflight.md

name: iOS TestFlight

on:
  workflow_dispatch:
  push:
    tags:
      - "ios-v*"
    branches:
      - main

jobs:
  # Cheap Linux check on every push: does the offline payload still build, and
  # is it still free of remote references? That audit is the only thing standing
  # between a new CDN dependency in src/loudlight.jsx and an app that white-screens
  # on a plane, and it costs seconds here versus a round trip through a macOS
  # runner.
  payload:
    name: Offline payload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:ios
      - name: Check the payload is complete
        run: |
          set -euo pipefail
          test -s ios/www/index.html
          test -s ios/www/react.production.min.js
          test -s ios/www/react-dom.production.min.js
          test -s ios/www/lame.min.js
          test -d ios/www/samples/808-kit
          test -d ios/www/fonts
          echo "payload ok — $(du -sh ios/www | cut -f1)"

  upload:
    name: Archive and upload
    # Only for a deliberate release: the manual button, or an ios-v* tag.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/ios-v')
    needs: payload
    # macos-26 (Tahoe, Xcode 26.x) — generally available since Feb 2026 and what
    # macos-latest now resolves to. Pinned rather than floating so an image
    # rollover can't change the SDK under a release, and matched to the Xcode
    # the app is developed against locally.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build the web payload
        run: |
          npm ci
          npm run build:ios

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Check signing is configured
        run: |
          set -euo pipefail
          if ! grep -qE '^DEVELOPMENT_TEAM *= *[A-Z0-9]{10}' ios/Config/LoudLight.xcconfig; then
            echo "::error::DEVELOPMENT_TEAM is not set in ios/Config/LoudLight.xcconfig."
            echo "Put your 10-character Apple Developer Team ID there and commit it."
            exit 1
          fi

      - name: Write the App Store Connect API key
        env:
          KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
        run: |
          set -euo pipefail
          if [ -z "$KEY" ] || [ -z "$KEY_ID" ]; then
            echo "::error::APPSTORE_PRIVATE_KEY / APPSTORE_KEY_ID are not set. See docs/ios-testflight.md."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$KEY" | base64 --decode > "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"
          chmod 600 "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"

      - name: Import the signing certificate
        env:
          P12: ${{ secrets.APPLE_DIST_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$P12" ]; then
            echo "::error::APPLE_DIST_CERT_P12 is not set. Without it, automatic signing mints a NEW"
            echo "::error::Apple Distribution certificate on this runner, and Apple only allows three."
            echo "::error::See docs/ios-testflight.md."
            exit 1
          fi
          # A throwaway keychain, not the login one: it is unlocked with a
          # password that exists only for this job, and it is destroyed at the
          # end whether the build passed or failed.
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -f pkcs12 -A
          rm -f "$RUNNER_TEMP/dist.p12"
          # Without this, codesign blocks on a GUI "allow access to key?" prompt
          # that no one is there to answer, and the job hangs until it times out.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          # Put it in the search list so xcodebuild looks in it at all.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "Signing identities available:"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Archive
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project ios/LoudLight.xcodeproj \
            -scheme LoudLight \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/LoudLight.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      # Uploads straight to App Store Connect — see destination:upload in
      # ExportOptions.plist. Processing then takes ~5-15 minutes before the
      # build appears in TestFlight.
      - name: Export and upload to App Store Connect
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/LoudLight.xcarchive" \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      # The archive carries the dSYMs. If a beta build crashes, this is the
      # difference between a readable stack and a column of hex.
      - name: Keep the archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LoudLight-xcarchive-${{ github.run_number }}
          path: ${{ runner.temp }}/LoudLight.xcarchive
          retention-days: 14
          if-no-files-found: ignore

      - name: Always shred the key and the keychain
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/keys" "$RUNNER_TEMP/dist.p12"
          if [ -n "${KEYCHAIN:-}" ] && [ -f "$KEYCHAIN" ]; then
            security delete-keychain "$KEYCHAIN" || true
          fi
